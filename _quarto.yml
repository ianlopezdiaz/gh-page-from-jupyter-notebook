project:
  type: website

website:
  title: "GitHub page created from Jupyter Notebook"
  description: "Sample GitHub page created from Jupyter Notebook using Quarto"
  site-url: "https://ianlopezdiaz.github.io/gh-page-from-jupyter-notebook"
  #favicon: images/favicon.ico # opcional — remova se não tiver
  navbar:
    left:
      - text: "Introduction"
        href: index.md
      - text: "First Notebook"
        href: notebook-01.ipynb
      - text: "Second Notebook"
        href: notebook-02.ipynb
      - text: "Third Notebook"
        href: notebook-03.ipynb
    right:
      - icon: github
        href: https://ianlopezdiaz.github.io/gh-page-from-jupyter-notebook
  page-footer:
    left: "© 2025 ianlopezdiaz"
    right: "Made using [Quarto](https://quarto.org/)"



format:
  html:
    theme:
      dark: solar
      light: minty
    toc: true
    toc-depth: 3
    code-fold: false
    highlight-style: github



